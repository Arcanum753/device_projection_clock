#------------------------- esp32 + projection clock (без macros) -------------------------
[env:esp32_projection_clock]
extends = env:esp32
src_filter = ${env:esp32.src_filter} +<module_udp/> +<module_otaclient/> +<device_projection_clock/>
build_flags=
	${env.build_flags}
	${env:esp32.build_flags}
	-D DEBUG_PROJ_CLOCK
	-D DEBUG_OTA
	-D DEBUG_STATE=1
	-D DEBUG_TASK=1
	; Вывод ленты: по умолчанию I2S+DMA (NeoEsp32I2s0Ws2812xMethod).
	; Для ESP32-C3/S3 или при проблемах I2S включить RMT:
	; -D PROJ_CLOCK_USE_RMT=1
lib_deps =
	${env.lib_deps}
	${env:esp32.lib_deps}

#------------------------- registry (автогенерация modules_registry) -------------------------
[registry]
object = proj_clock
define = DEVICE_PROJ_CLOCK
namespace = proj_clock
web = 1
loop = 0
res = 1
prio = 70
